            console.log('loading_layout', loading_layout)
            if (loading_layout) {
              loading_layout.style.display = ''
              loadingEffect()
            }
          }, 1000)

          function loadingEffect() {
            var h = setInterval(addDot, 382)

            var loading_text_arr = 'Loading'.split('')
            function addDot() {
              var before_el = document.getElementsByClassName('text-before')[0]
              var text_el = document.getElementsByClassName('text')[0]
              var after_el = document.getElementsByClassName('text-after')[0]
              if (before_el && text_el && after_el) {
                var [ ch ] = loading_text_arr.splice(0, 1)

                if (ch !== undefined) {
                  text_el.innerText += ch
                } else {
                  before_el.innerText += '。'
                  after_el.innerText += '。'
                  if (after_el.innerText.length > 7) {
                    before_el.innerText = ''
                    after_el.innerText = ''
                  }
                }
              } else {
                clearInterval(h)
              }
            }
          }
        })();
      </script>
      <style>
        .loading-layout {
          position: fixed;
          left: 0;
          top: 0;
          width: 100vw;
          height: 100vh;
          height: 100dvh;

          justify-content: center;
          align-items: center;
          font-family: "guanzhi 8x8 base";

          color: #777;
        }
        .text-before {
          opacity: 0;
        }
      </style>
