services:
  api:
    build: .
    image: torzo-gallery
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "7001:7001"
    volumes:
      - ./storage-migrated:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
